# Log agent-user in on the VM console (ttyS0 under Firecracker, hvc0 under QEMU).
# Wait for isolate-prepare (/persist dirs, Claude seed, agent state links).
[Unit]
After=isolate-export.service

[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin agent-user --noreset --noclear --keep-baud 115200,57600,38400,9600 - ${TERM}
